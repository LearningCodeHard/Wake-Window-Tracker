<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Graham’s Day Planner</title><style>__PROTOTYPE_CSS__</style></head><body>
<div id="toast" class="toast" role="status"></div><main id="app">
<header class="header"><div><h1 id="appTitle">Graham’s Day Planner</h1><div class="date" id="dateText"></div></div><div class="header-tools"><button class="icon-btn" onclick="theme()" aria-label="Switch Light and Dark">◐</button><button class="icon-btn" onclick="settingsSheet()" aria-label="Settings">⚙</button></div></header>
<div id="notice" class="banner warning" hidden></div>
<div class="day-picker"><div class="date-frame"><input aria-label="View date" type="date" id="viewDate" onchange="changeDay(this.value)"></div><button class="small-btn" onclick="changeDay(WW.parts(clock(),S.settings.timezone).date)">Today</button></div>
<section class="current-state"><div class="current-main" id="currentState"></div><div class="current-sub" id="currentSince"></div></section>
<section><div class="section-head"><h2 id="timelineTitle">Rest of Today</h2><span class="section-note" id="timelineNote">Suggested</span></div><div class="timeline" id="timeline"></div></section>
<section id="guidance" class="banner warning guidance" hidden><h3 id="guidanceTitle"></h3><p id="guidanceText"></p><div class="toolbar"><button class="small-btn" onclick="planningSheet()">Review Adjustments</button><button class="small-btn" onclick="bedtimeSheet()">Change Bedtime</button></div></section>
<details id="earlierDetails"><summary>Earlier Today · <span id="napTotal"></span></summary><div class="timeline earlier" id="earlierTimeline"></div></details>
<footer><div class="footer-row"><button class="small-btn" onclick="morningSheet()">Morning Wake</button><button class="small-btn" onclick="bedtimeSheet()">Change Bedtime</button><button id="updatesButton" class="small-btn" onclick="updatesSheet()">Updates</button></div><div class="footer-actions"><button onclick="refresh()">Refresh</button><button class="primary" onclick="addSheet()">+ Add</button></div><div class="toolbar"><button class="small-btn" id="endActive" hidden onclick="finishNapSheet(activeIndex())">End Nap</button><button class="small-btn" id="demoAdvance" hidden onclick="advanceDemo()">Demo: +90 Minutes</button></div><div class="footer-info"><div id="saveState" class="save-state" role="status"></div><div id="operationState" class="save-state" role="status"></div></div></footer>
</main>
<div class="backdrop" id="backdrop" onclick="closeSheet()"></div><section class="sheet" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="handle"></div><div class="sheet-header"><h2 id="modalTitle"></h2><button class="small-btn" onclick="closeSheet()">Close</button></div><div class="sheet-scroll" id="modalScroll"><div id="modalBody"></div><div id="modalError" class="sheet-error" role="alert"></div></div></section>
<script>__CORE__</script><script>__UI__</script></body></html>
