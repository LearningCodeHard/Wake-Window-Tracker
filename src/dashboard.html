<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Graham’s Day Planner</title><style>__PROTOTYPE_CSS__</style></head><body>
<div id="toast" class="toast" role="status"></div><main id="app">
<header class="header"><div><h1 id="appTitle">Graham’s Day Planner</h1><div class="date" id="dateText"></div></div><div class="header-tools"><button class="icon-btn" onclick="theme()" aria-label="Switch Light and Dark">◐</button></div></header>
<div id="notice" class="banner warning" hidden></div>
<div class="day-picker"><div class="date-frame"><input aria-label="View date" type="date" id="viewDate" onchange="changeDay(this.value)"></div><button class="small-btn" onclick="changeDay(WW.parts(clock(),S.settings.timezone).date)">Today</button></div>
<div class="day-metrics" id="dayMetrics">
  <button class="metric metric-edit" id="morningMetricButton" onclick="morningSheet()" aria-haspopup="dialog">
    <span class="metric-label">Morning Wake</span><span class="metric-value" id="morningMetric"></span><span class="edit-icon" aria-hidden="true"></span>
  </button>
  <button class="metric metric-edit" id="napMetricTile" onclick="napCountsSheet()" aria-haspopup="dialog"><span class="metric-label">Daily Naps</span><span class="metric-value" id="napMetric"></span><span class="metric-sub" id="napMaxMetric"></span><span class="edit-icon" aria-hidden="true"></span></button>
  <button class="metric metric-edit" id="bedtimeMetricTile" onclick="bedtimeSheet()" aria-haspopup="dialog"><span class="metric-label">Bedtime Target</span><span class="metric-value" id="bedtimeMetric"></span><span class="edit-icon" aria-hidden="true"></span></button>
</div>
<section class="current-state" id="currentPanel"><div class="current-main" id="currentState"></div><div class="current-sub" id="currentSince"></div><button class="small-btn" id="endActive" hidden onclick="finishNapSheet(activeIndex())">End Nap</button></section>
<section id="guidance" class="banner warning guidance" hidden aria-labelledby="guidanceTitle">
  <h3 id="guidanceTitle"></h3>
  <p id="guidanceText"></p><p id="guidanceImpact" hidden></p>
  <div id="guidanceActions" class="toolbar"></div>
</section>
<section aria-labelledby="timelineTitle">
  <div class="section-head"><h2><span id="timelineTitle">Today’s Plan</span><span class="timeline-status" id="timelineNote" hidden></span></h2><span class="section-note" id="napTotal"></span></div>
  <div class="timeline" id="timeline"></div>
</section>
<div id="planControls" class="plan-controls" hidden><div id="planActions" class="toolbar"></div></div>
<footer><div class="footer-actions">
  <button class="primary" onclick="addSheet()"><span aria-hidden="true">+</span> Add</button>
  <button id="recalculateButton" onclick="recalculate()"><span aria-hidden="true">↻</span> Recalculate</button>
  <button onclick="moreSheet()"><span aria-hidden="true">⋯</span> More</button>
</div><div class="toolbar"><button class="small-btn" id="demoAdvance" hidden onclick="advanceDemo()">Demo: +90 Minutes</button></div><div class="footer-info"><div id="saveState" class="save-state" role="status"></div><div id="operationState" class="save-state" role="status"></div></div></footer>
</main>
<div class="backdrop" id="backdrop" onclick="closeSheet()"></div><section class="sheet" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="handle"></div><div class="sheet-header"><h2 id="modalTitle"></h2><button class="small-btn" onclick="closeSheet()">Close</button></div><div class="sheet-scroll" id="modalScroll"><div id="modalBody"></div></div><div id="modalError" class="sheet-error" role="alert"></div><div id="modalActions" class="sheet-actions sheet-footer" hidden></div></section>
<script>__CORE__</script><script>__UI__</script></body></html>
